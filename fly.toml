# Despliegue en Fly.io — https://fly.io
# Cambia el nombre y la región antes del primer deploy:
#   fly launch --no-deploy   (o edita esto a mano)
app = "aura-farm"
primary_region = "scl"   # Santiago de Chile — el evento es acá

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  DATA_DIR = "/data"
  PREP_MS = "60000"
  BATTLE_MS = "120000"
  MAX_JUDGMENTS_PER_BATTLE = "10"

[http_service]
  internal_port = 8080
  force_https = true
  # El estado del lobby vive en memoria del proceso: NO escalar a varias
  # máquinas sin el adaptador de Redis. Ver DEPLOY.md.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 800

# El snapshot del leaderboard sobrevive a los redeploys.
[[mounts]]
  source = "aura_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[checks.health]
  type = "http"
  port = 8080
  path = "/api/health"
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
